name: 打包安卓 APK

on:
  push:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 检查项目文件
        run: |
          echo "仓库里的文件："
          find . -maxdepth 3 -not -path "./.git*" | sort | head -60
          F=$(find . -name capacitor.config.json -not -path "*/node_modules/*" | head -1)
          if [ -z "$F" ]; then
            echo "::error::仓库里没有找到 capacitor.config.json。请把 q-texas-holdem-app.zip 解压后，文件夹里的全部文件（www、android-res、scripts、package.json 等）上传到仓库。"
            exit 1
          fi
          DIR=$(dirname "$F")
          MISSING=""
          for f in package.json www/index.html scripts/prepare-www.js android-res; do
            if [ ! -e "$DIR/$f" ]; then
              echo "::error::缺少：$f（应放在 $DIR 目录下）"
              MISSING=1
            fi
          done
          [ -z "$MISSING" ] || exit 1
          echo "项目目录：$DIR"
          echo "PROJ=$DIR" >> "$GITHUB_ENV"

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 计算版本号
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            V="${{ github.event.release.tag_name }}"
            V="${V#v}"
          else
            V="1.0.${{ github.run_number }}"
          fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "版本号：$V"

      - name: 安装依赖并准备网页
        working-directory: ${{ env.PROJ }}
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: 生成安卓工程
        working-directory: ${{ env.PROJ }}
        run: |
          npx cap add android
          cp -r android-res/. android/app/src/main/res/
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${APP_VERSION}\"/" android/app/build.gradle
          npx cap sync android
          chmod +x android/gradlew

      - name: 编译正式签名版
        if: env.KEYSTORE_BASE64 != ''
        working-directory: ${{ env.PROJ }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > release.keystore
          (cd android && ./gradlew assembleRelease --no-daemon)
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --out "QMengPoker-${APP_VERSION}.apk" aligned.apk
          "$BT/apksigner" verify "QMengPoker-${APP_VERSION}.apk" && echo "签名成功"

      - name: 编译测试版（未配置签名时）
        if: env.KEYSTORE_BASE64 == ''
        working-directory: ${{ env.PROJ }}
        run: |
          echo "::warning::没有配置签名密钥，本次生成的是测试版。每次重新打包后需要先卸载旧版才能安装新版。"
          (cd android && ./gradlew assembleDebug --no-daemon)
          cp android/app/build/outputs/apk/debug/app-debug.apk "QMengPoker-${APP_VERSION}-debug.apk"

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: QMengPoker-${{ env.APP_VERSION }}
          path: ${{ env.PROJ }}/QMengPoker-*.apk

      - name: 附加到 Release 发布页
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJ }}/QMengPoker-*.apk
